<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HU-06 · Consultar al agente de inventario</title>
<style>
:root { --bg:#eef0f4; --card:#fff; --fg:#1d2330; --muted:#6b7280; --line:#e3e6ec;
        --low:#fde8e8; --lowfg:#9b1c1c; --acc:#1f5fbf; --acc2:#174c99; --ok:#0f7b4b; --okbg:#e3f5ec;
        --warn:#8a5a00; --warnbg:#fff4d6; --ease:cubic-bezier(.2,.7,.3,1); }
* { box-sizing:border-box; }
body { margin:0; padding:24px; font:15px/1.45 "Segoe UI", system-ui, sans-serif; background:var(--bg); color:var(--fg); }
.win { width:952px; max-width:100%; margin:0 auto; background:var(--card); border-radius:10px; overflow:hidden;
       box-shadow:0 8px 28px #1d233026; border:1px solid #d5d9e0; animation:rise .4s var(--ease); }
@keyframes rise { from { opacity:0; transform:translateY(8px); } }
.chrome { display:flex; align-items:center; gap:8px; padding:10px 14px; background:#e7eaf0; border-bottom:1px solid #d5d9e0; }
.chrome i { width:12px; height:12px; border-radius:50%; display:inline-block; }
.chrome i:nth-child(1){background:#f26b5e} .chrome i:nth-child(2){background:#f5bf4f} .chrome i:nth-child(3){background:#5fc454}
.url { margin-left:12px; flex:1; background:#fff; border-radius:6px; padding:4px 10px; font-size:13px; color:var(--muted); }
header { display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
header h1 { font-size:18px; margin:0; flex:1; }
.tag { font-size:12px; color:var(--muted); }
nav { display:flex; gap:8px; }
.btn { display:inline-block; border:1px solid var(--acc); background:none; color:var(--acc); padding:6px 14px; border-radius:6px;
       font:inherit; font-size:14px; cursor:pointer; text-decoration:none;
       transition:background .15s, color .15s, transform .1s, box-shadow .15s, opacity .15s; }
.btn:hover { background:#e9f0fc; }
.btn:active { transform:scale(.97); }
.btn.primary, .btn[aria-current=page] { background:var(--acc); color:#fff; }
.btn.primary:hover, .btn[aria-current=page]:hover { background:var(--acc2); }
.btn.ghost { border-color:var(--line); color:var(--fg); }
.btn.ghost:hover { background:#f3f4f7; }
.btn:disabled { opacity:.45; cursor:not-allowed; transform:none; }
.btn:focus-visible, input:focus-visible, select:focus-visible, th[data-k]:focus-visible, .chip:focus-visible, tr[tabindex]:focus-visible
  { outline:2px solid var(--acc); outline-offset:2px; }
main { padding:20px; }
h2 { font-size:16px; margin:0 0 12px; }
table { width:100%; border-collapse:collapse; font-size:14px; }
th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); transition:background .2s; }
th { color:var(--muted); font-weight:600; font-size:13px; user-select:none; }
th[data-k] { cursor:pointer; }
th[data-k]:hover { color:var(--fg); }
th[aria-sort=ascending]::after { content:" ▲"; font-size:10px; }
th[aria-sort=descending]::after { content:" ▼"; font-size:10px; }
tbody tr:hover td { background:#f6f8fb; }
td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
tr.low td, tr.low:hover td { background:var(--low); color:var(--lowfg); font-weight:600; }
tr.flash td { animation:flash 1.2s; }
@keyframes flash { 0%,40% { background:#dbe8fb; } }
tr.sel td { background:#e9f0fc; }
.muted { color:var(--muted); font-size:13px; }
.row { display:flex; gap:16px; flex-wrap:wrap; }
.card { border:1px solid var(--line); border-radius:8px; padding:14px; flex:1; min-width:240px; transition:box-shadow .2s, transform .2s; }
.card:hover { box-shadow:0 4px 14px #1d23301a; }
.pill { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:600; transition:background .25s, color .25s; }
.pill.ok { background:var(--okbg); color:var(--ok); }
.pill.warn { background:var(--warnbg); color:var(--warn); }
.pill.err { background:var(--low); color:var(--lowfg); }
.pill.info { background:#e6eefb; color:var(--acc); }
.banner { padding:10px 14px; border-radius:8px; font-size:14px; }
.banner.err { background:var(--low); color:var(--lowfg); }
.banner.warn { background:var(--warnbg); color:var(--warn); }
.banner.ok { background:var(--okbg); color:var(--ok); }
.toolbar { display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
.toolbar h2 { flex:1; margin:0; }
.sim { display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:#f6f7f9; border:1px dashed #c9ced8;
       border-radius:8px; padding:8px 12px; margin-bottom:16px; font-size:14px; }
.sim b { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
input, select { font:inherit; padding:7px 10px; border:1px solid #c9ced8; border-radius:6px; background:#fff; transition:border-color .15s; }
input[aria-invalid=true] { border-color:var(--lowfg); background:#fff8f8; }
input[type=range] { padding:0; accent-color:var(--acc); }
input[type=checkbox] { accent-color:var(--acc); }
.kpi { font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; transition:color .3s; }
.chip { border:1px solid var(--line); background:#fff; border-radius:999px; padding:4px 12px; font:inherit; font-size:13px; cursor:pointer; transition:all .15s; }
.chip:hover { border-color:var(--acc); }
.chip[aria-pressed=true] { background:var(--acc); border-color:var(--acc); color:#fff; }
.hidden { display:none !important; }
.spin { display:inline-block; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.toast { position:fixed; left:50%; bottom:24px; transform:translate(-50%, 20px); opacity:0; padding:10px 16px; border-radius:8px;
         background:#1d2330; color:#fff; font-size:14px; box-shadow:0 8px 24px #0004; transition:all .3s var(--ease); z-index:10; max-width:90vw; }
.toast.show { opacity:1; transform:translate(-50%, 0); }
.toast.warn { background:#6b4700; } .toast.err { background:#7f1d1d; }
dialog { border:1px solid var(--line); border-radius:10px; padding:20px; width:460px; max-width:92vw; box-shadow:0 12px 40px #1d233040; }
dialog[open] { animation:pop .2s var(--ease); }
dialog::backdrop { background:#1d233040; }
@keyframes pop { from { opacity:0; transform:scale(.96); } }
.err-msg { color:var(--lowfg); font-size:13px; min-height:18px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="win">
<div class="chrome"><i></i><i></i><i></i><span class="url">https://inventario.example.com/agente</span></div>
<header><h1>Inventario · Ferretería</h1><span class="tag">Gerente de operaciones</span><nav><a class="btn"  href="../HU-01-consultar-stock/HU-01.html">Inventario</a><a class="btn"  href="../HU-04-orden-de-compra-atomica/HU-04.html">Órdenes</a><a class="btn" aria-current="page" href="../HU-06-agente-inventario/HU-06.html">Agente IA</a></nav></header>
<main>

<div class="row">
<div class="card" style="flex:2;display:flex;flex-direction:column;gap:10px">
<h2 style="margin:0">Agente de inventario <span class="pill info">Claude · Bedrock</span></h2>
<div id="log" aria-live="polite" style="display:flex;flex-direction:column;gap:10px;max-height:330px;overflow-y:auto;padding-right:4px"></div>
<div style="display:flex;gap:6px;flex-wrap:wrap" id="sugg">
<button class="chip">¿Qué productos están en riesgo?</button><button class="chip">¿Cuáles órdenes están en cola?</button>
<button class="chip">Borra la orden 1042</button></div>
<form id="f" style="display:flex;gap:8px"><input id="q" style="flex:1" placeholder="Escribe tu pregunta…" aria-label="Pregunta" autocomplete="off">
<button class="btn primary" id="send">Enviar</button></form>
<div style="display:flex"><div class="err-msg" id="qerr" style="flex:1"></div><span class="muted" id="cnt">0 / 1000</span></div>
</div>
<div class="card"><h2>Alertas recientes</h2><div id="alerts"></div></div></div>

</main>
</div>
<script>
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
function toast(msg, kind = '') {
  const t = Object.assign(document.createElement('div'), { className: 'toast ' + kind, textContent: msg });
  t.setAttribute('role', 'status'); document.body.append(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2800);
}
const DAYS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const inHours = (d, h) => d >= 1 && d <= 5 && h >= 8 && h < 18;  // L-V 08:00-18:00
function nextRun(d, h) {  // próxima revisión a la hora en punto, L-V 08-17
  for (let i = 1; i <= 24 * 7; i++) {
    const hh = (h + i) % 24, dd = (d + Math.floor((h + i) / 24)) % 7;
    if (dd >= 1 && dd <= 5 && hh >= 8 && hh <= 17) return (i < 24 - h ? 'Hoy ' : DAYS[dd] + ' ') + String(hh).padStart(2, '0') + ':00';
  }
}
function sortable(table, render) {  // clic en encabezado con data-k ordena; render(key, dir)
  $$('th[data-k]', table).forEach(th => {
    th.tabIndex = 0;
    const go = () => {
      const dir = th.getAttribute('aria-sort') === 'ascending' ? 'descending' : 'ascending';
      $$('th', table).forEach(x => x.removeAttribute('aria-sort')); th.setAttribute('aria-sort', dir);
      render(th.dataset.k, dir === 'ascending' ? 1 : -1);
    };
    th.onclick = go; th.onkeydown = e => (e.key === 'Enter' || e.key === ' ') && (e.preventDefault(), go());
  });
}


const MSG_CSS = { me: 'align-self:flex-end;background:var(--acc);color:#fff;border-radius:12px 12px 2px 12px;max-width:75%',
                  bot: 'background:#f1f3f7;border-radius:12px 12px 12px 2px;max-width:85%' };
function add(who, text) {
  const d = document.createElement('div'); d.style.cssText = MSG_CSS[who] + ';padding:8px 12px;animation:rise .25s';
  d.textContent = text; $('#log').append(d); $('#log').scrollTop = 1e6; return d;
}
function answer(q) {
  q = q.toLowerCase();
  if (/borra|elimina|modifica|crea|cambia|cancela/.test(q))
    return 'Solo puedo consultar información; no modifico productos ni órdenes. Eso se hace desde las pantallas de Inventario u Órdenes.';
  if (/riesgo|bajo|umbral|stock|quiebre/.test(q))
    return 'SKU-002 (Tuerca hexagonal) tiene 35 u., bajo su umbral de 80; ya hay 1 orden pendiente por 200 u. SKU-004 (Broca 6mm) tiene 12 u. con umbral 20; su solicitud de 50 u. se encoló a las 10:00.';
  if (/orden|cola|pedido|compra/.test(q))
    return 'Hay 2 órdenes creadas hoy (#1042 SKU-002, #1043 SKU-004). En cola: SKU-003 (250 u., manual del sábado) se procesará el próximo día hábil a las 8:00; SKU-005 va en el reintento 2/3.';
  return 'Solo puedo responder sobre el inventario, las solicitudes y las órdenes de compra.';
}
function validate() {
  const n = $('#q').value.length; $('#cnt').textContent = n + ' / 1000';
  const bad = n > 1000; $('#q').setAttribute('aria-invalid', bad);
  $('#qerr').textContent = bad ? 'Pregunta demasiado larga (máx. 1000)' : ''; $('#cnt').style.color = bad ? 'var(--lowfg)' : '';
  return !bad;
}
function ask(text) {
  text = text.trim(); if (!text || !validate()) return;
  add('me', text); $('#q').value = ''; validate(); $('#send').disabled = true;
  const typing = add('bot', '•••'); typing.style.opacity = .6;
  setTimeout(() => { typing.style.opacity = 1; typing.textContent = answer(text); $('#send').disabled = false; $('#q').focus(); }, 900);
}
$('#f').onsubmit = e => { e.preventDefault(); ask($('#q').value); };
$('#q').oninput = validate;
$('#sugg').onclick = e => e.target.closest('.chip') && ask(e.target.textContent);
const ALERTS = [['err', 'ALTA', 'SKU-002: tercera reposición en 7 días.', '14/11 09:02'],
                ['warn', 'MEDIA', 'SKU-004 a 60% bajo el umbral.', '14/11 10:01'],
                ['info', 'INFO', '2 solicitudes manuales en cola del fin de semana.', '13/11 08:05']];
$('#alerts').innerHTML = ALERTS.map(([k, s, t, at]) => `<div class="alert" style="margin-bottom:10px;transition:opacity .3s">
  <div style="display:flex"><span class="pill ${k}">${s}</span><span style="flex:1"></span>
  <button class="btn ghost" style="padding:0 7px" aria-label="Descartar alerta">×</button></div>
  <div style="font-size:14px;margin-top:4px">${t}</div><div class="muted">${at}</div></div>`).join('');
$('#alerts').onclick = e => { const b = e.target.closest('button'); if (!b) return;
  const a = b.closest('.alert'); a.style.opacity = 0; setTimeout(() => { a.remove();
  if (!$('.alert')) $('#alerts').innerHTML = '<p class="muted">Sin alertas pendientes.</p>'; }, 300); };
add('me', '¿Qué productos están en riesgo?'); add('bot', answer('riesgo'));
add('me', 'Borra la orden 1042'); add('bot', answer('borra'));

</script>
</body>
</html>
