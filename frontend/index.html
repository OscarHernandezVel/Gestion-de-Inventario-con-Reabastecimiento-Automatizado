<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventario</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1d2330; --muted:#6b7280; --low:#fde8e8; --lowfg:#9b1c1c; --acc:#1f5fbf; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151b; --card:#1b2029; --fg:#e6e8ec; --muted:#9aa3b2; --low:#3b1d1d; --lowfg:#fca5a5; --acc:#6ea0ff; } }
  body { margin:0; font:15px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; gap:12px; align-items:center; padding:12px 16px; background:var(--card); border-bottom:1px solid #8883; }
  header h1 { font-size:18px; margin:0 auto 0 0; }
  nav button, .btn { border:1px solid var(--acc); background:none; color:var(--acc); padding:6px 12px; border-radius:6px; cursor:pointer; }
  nav button[aria-pressed=true], .btn.primary { background:var(--acc); color:#fff; }
  main { max-width:960px; margin:16px auto; padding:0 16px; }
  section { background:var(--card); border-radius:8px; padding:12px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid #8882; white-space:nowrap; }
  tr.low td { background:var(--low); color:var(--lowfg); font-weight:600; }
  .muted { color:var(--muted); font-size:13px; }
  .msg { margin:8px 0; min-height:1.4em; }
  #chat { display:flex; flex-direction:column; gap:8px; }
  #log p { margin:6px 0; }
  form.ask { display:flex; gap:8px; } form.ask input { flex:1; padding:8px; }
  dialog { border:none; border-radius:8px; padding:16px; max-width:360px; background:var(--card); color:var(--fg); }
  dialog::backdrop { background:#0006; }
  .btn + .btn { margin-left:4px; }
  .btn:disabled { opacity:.5; cursor:default; }
  details.cat { margin:4px 0 4px 18px; }
  #tree > details.cat { margin-left:0; }
  details.cat > summary { cursor:pointer; padding:6px 4px; border-radius:6px; }
  details.cat > summary:hover { background:#8881; }
  .cat-name { font-weight:600; }
  .badge { display:inline-block; font-size:12px; padding:1px 8px; border-radius:999px; margin-left:6px; background:#8882; }
  .badge.low { background:var(--low); color:var(--lowfg); font-weight:600; }
  ul.items { margin:2px 0 6px 18px; padding-left:18px; }
  ul.items li.low { color:var(--lowfg); font-weight:600; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>Inventario</h1>
  <nav>
    <button data-view="inv" aria-pressed="true">Inventario</button>
    <button data-view="cat" aria-pressed="false">Categorías</button>
    <button data-view="ord" aria-pressed="false">Órdenes</button>
    <button data-view="ai" aria-pressed="false">Agente IA</button>
  </nav>
</header>
<main>
  <p class="msg" id="msg" role="status"></p>

  <section id="inv">
    <table><thead><tr><th>SKU</th><th>Producto</th><th>Stock</th><th>Umbral</th><th>Pend.</th>
      <th title="Promedio de las últimas 24 lecturas">Consumo/h</th><th>Se agota en</th><th></th></tr></thead>
      <tbody id="products"></tbody></table>
    <p class="muted">Última actualización: <span id="updated">—</span> <button class="btn" id="refresh">↻ Actualizar</button></p>
  </section>

  <section id="cat" hidden>
    <p class="muted">Stock, productos bajo umbral, órdenes pendientes y consumo sumados en cada nivel de la bodega.</p>
    <div id="tree"></div>
  </section>

  <section id="ord" hidden>
    <table><thead><tr><th>#OC</th><th>SKU</th><th>Cantidad</th><th>Origen</th><th>Estado</th><th>Fecha</th><th></th></tr></thead>
      <tbody id="orders"></tbody></table>
  </section>

  <section id="ai" hidden>
    <div id="chat">
      <div id="log" aria-live="polite"></div>
      <form class="ask" id="ask"><input id="question" maxlength="1000" placeholder="Escribe tu pregunta..." aria-label="Pregunta" required><button class="btn primary">Enviar</button></form>
      <h3>Alertas recientes</h3><ul id="insights"></ul>
    </div>
  </section>
</main>

<dialog id="qtyDialog" aria-labelledby="dlgTitle">
  <form method="dialog" id="dlgForm">
    <h3 id="dlgTitle"></h3>
    <p id="dlgProduct"></p>
    <label>Cantidad: <input type="number" id="dlgQty" min="1" max="10000" required></label>
    <p class="muted" id="dlgHint"></p>
    <button class="btn" value="cancel" formnovalidate>Cancelar</button>
    <button class="btn primary" value="ok" id="dlgOk"></button>
  </form>
</dialog>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const say = t => $("msg").textContent = t;
async function api(path, opts) {
  const r = await fetch(path, opts && {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(opts)});
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || "Error");
  return data;
}
function businessHours() {
  const d = new Date(new Date().toLocaleString("en-US", {timeZone:"America/Bogota"}));
  return d.getDay() >= 1 && d.getDay() <= 5 && d.getHours() >= 8 && d.getHours() < 18;
}
let products = [];
async function loadProducts() {
  try {
    products = await api("/api/products");
    $("products").innerHTML = products.map(p => `<tr class="${p.low ? "low" : ""}"><td>${esc(p.sku)}</td><td>${esc(p.name)}</td>
      <td>${p.stock}</td><td>${p.threshold}</td><td>${p.pending_orders}</td>
      <td>${p.consumption_per_hour ? p.consumption_per_hour + " u." : "—"}</td>
      <td>${p.hours_to_stockout != null ? p.hours_to_stockout + " h" : "—"}</td>
      <td><button class="btn" data-act="restock" data-id="${p.id}">Pedir</button><button class="btn" data-act="dispatch"
        data-id="${p.id}" ${p.stock ? "" : "disabled"}>Salida</button></td></tr>`).join("");
    $("updated").textContent = new Date().toLocaleTimeString();
    say("");
  } catch { $("products").innerHTML = ""; say("No se pudo cargar el inventario, reintente"); }
}
async function loadOrders() {
  try {
    const rows = await api("/api/orders");
    const status = o => o.status === "QUEUED" ? "EN COLA" : o.po_status === "RECEIVED" ? "RECIBIDA" : "CREADA";
    $("orders").innerHTML = rows.map(o => `<tr><td>${o.po_id ?? "—"}</td><td>${esc(o.sku)}</td><td>${o.qty}</td>
      <td>${o.source === "SCHEDULER" ? "AUTO" : "MANUAL"}</td><td>${status(o)}</td><td>${esc(o.created_at)}</td>
      <td>${o.po_id && o.po_status !== "RECEIVED" ? `<button class="btn" data-po="${o.po_id}" data-sku="${esc(o.sku)}"
        data-qty="${o.qty}">Recibir</button>` : ""}</td></tr>`).join("");
  } catch (e) { say(e.message); }
}
async function loadInsights() {
  try { $("insights").innerHTML = (await api("/api/insights")).map(i => `<li>⚠ ${esc(i.severity)} ${esc(i.summary)}</li>`).join(""); } catch {}
}
document.querySelector("nav").onclick = e => {
  const v = e.target.dataset.view; if (!v) return;
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === v));
  ["inv","cat","ord","ai"].forEach(id => $(id).hidden = id !== v);
  ({inv:loadProducts, cat:loadTree, ord:loadOrders, ai:loadInsights})[v]();
};
$("refresh").onclick = loadProducts;
// Árbol de categorías con <details> nativo: las ramas con productos bajo umbral se abren solas.
function renderNode(n, open) {
  const badges = [`${n.products} prod.`, `${n.stock} u.`, n.pending_orders && `${n.pending_orders} pend.`,
                  n.consumption_per_hour && `${n.consumption_per_hour} u./h`].filter(Boolean)
                  .map(t => `<span class="badge">${t}</span>`).join("");
  const low = n.low ? `<span class="badge low">${n.low} bajo umbral</span>` : "";
  const items = (n.items || []).map(p => `<li class="${p.low ? "low" : ""}">${esc(p.sku)} · ${esc(p.name)} — ${p.stock} u.</li>`).join("");
  return `<details class="cat"${open ? " open" : ""}><summary><span class="cat-name">${esc(n.name)}</span>${badges}${low}</summary>
    ${items && `<ul class="items">${items}</ul>`}${n.children.map(c => renderNode(c, c.low > 0)).join("")}</details>`;
}
async function loadTree() {
  try { $("tree").innerHTML = renderNode(await api("/api/categories/tree"), true); say(""); }
  catch (e) { $("tree").innerHTML = ""; say(e.message); }
}

// Un solo diálogo de cantidad para "Pedir" (reabastecimiento) y "Salida" (despacho de bodega).
const MODES = {
  restock: {
    title: "Pedir reabastecimiento", ok: "Encolar", qty: p => p.suggested_qty ?? p.reorder_qty, max: () => 10000,
    hint: p => businessHours() ? `Sugerida: ${p.suggested_qty ?? p.reorder_qty} (cubre el consumo hasta que llegue el pedido)`
      : "ⓘ Fuera de horario hábil: se encolará y procesará el próximo día hábil a las 8:00.",
    send: (p, qty) => api(`/api/products/${p.id}/restock`, {qty}).then(r => r.message),
  },
  dispatch: {
    title: "Registrar salida de bodega", ok: "Registrar salida", qty: () => 1, max: p => Math.min(p.stock, 10000),
    hint: (p, qty = 1) => `Stock actual: ${p.stock} u. · quedará en ${Math.max(p.stock - qty, 0)}`
      + (p.stock - qty < p.threshold ? " (bajo el umbral)" : ""),
    send: (p, qty) => api(`/api/products/${p.id}/dispatch`, {qty}).then(r => `Salida registrada: ${r.sku} queda con ${r.stock} u.`),
  },
};
let current, mode;
$("products").onclick = e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  current = products.find(p => p.id == b.dataset.id); mode = MODES[b.dataset.act];
  $("dlgTitle").textContent = mode.title; $("dlgOk").textContent = mode.ok;
  $("dlgProduct").textContent = `Producto: ${current.sku} · ${current.name}`;
  $("dlgQty").value = mode.qty(current); $("dlgQty").max = mode.max(current);
  $("dlgHint").textContent = mode.hint(current);
  $("qtyDialog").showModal();
};
$("dlgQty").oninput = () => { if (mode === MODES.dispatch) $("dlgHint").textContent = mode.hint(current, Number($("dlgQty").value)); };
// "submit" llega al instante; el evento "close" del diálogo se retrasa si la pestaña está en segundo plano.
$("dlgForm").onsubmit = async e => {
  if (e.submitter?.value !== "ok") return;  // Cancelar: el diálogo se cierra solo
  try { const msg = await mode.send(current, Number($("dlgQty").value)); await loadProducts(); say(msg); }
  catch (err) { say(err.message); }
};

// Recepción de mercancía: confirma antes, porque suma stock (el backend impide recibir dos veces).
$("orders").onclick = async e => {
  const b = e.target.closest("button[data-po]"); if (!b) return;
  if (!confirm(`¿Llegaron ${b.dataset.qty} u. de ${b.dataset.sku} (orden #${b.dataset.po})? Se sumarán al stock.`)) return;
  b.disabled = true;
  try {
    const o = await api(`/api/orders/${b.dataset.po}/receive`, {});
    say(`Orden #${o.po_id} recibida: +${o.qty} u. de ${b.dataset.sku}`); loadOrders();
  } catch (err) { say(err.message); b.disabled = false; }
};
$("ask").onsubmit = async e => {
  e.preventDefault();
  const q = $("question").value.trim(); if (!q) return;
  $("log").insertAdjacentHTML("beforeend", `<p><b>Tú:</b> ${esc(q)}</p>`);
  $("question").value = "";
  try { $("log").insertAdjacentHTML("beforeend", `<p><b>Agente:</b> ${esc((await api("/api/agent", {question:q})).answer)}</p>`); }
  catch (err) { $("log").insertAdjacentHTML("beforeend", `<p class="muted">${esc(err.message)}</p>`); }
};
loadProducts();
</script>
</body>
</html>
